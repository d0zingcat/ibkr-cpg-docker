services:
  ibkr-cpg:
    # Use a published release tag; never use `latest`.
    image: ghcr.io/d0zingcat/ibkr-cpg-docker:v0.1.4
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ibkr-secrets:/run/ibkr-secrets:ro
    # 8081 is token-protected login control, scoped to this private network.
    expose: ["8080", "8081"]
    networks: [broker-internal, ibkr-egress]
  client:
    image: curlimages/curl:8.12.1
    command: ["sleep", "infinity"]
    networks: [broker-internal]
volumes:
  ibkr-secrets:
networks:
  broker-internal: {internal: true}
  ibkr-egress: {}
