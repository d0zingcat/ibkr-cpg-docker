name: ibkr-cpg

# Dokploy source-build deployment. The CPG is a standalone service that joins
# a deployment-provided private broker network.
services:
  ibkr-cpg:
    image: ibkr-cpg:source
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: build
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ibkr-cpg-secrets:/run/ibkr-secrets:ro
    # No host ports or public domain: both APIs stay on the private network.
    expose: ["8080", "8081"]
    networks: [broker-internal, ibkr-egress]

networks:
  # The consuming application supplies this physical network name when it
  # differs from the portable default.
  broker-internal:
    external: true
    name: ${BROKER_INTERNAL_NETWORK:-broker-internal}
  # The CPG alone has outbound access for IBKR connectivity.
  ibkr-egress: {}

volumes:
  # Existing high-privilege token and optional credentials.json; never create
  # a project-prefixed replacement volume.
  ibkr-cpg-secrets:
    external: true
    name: ${IBKR_CPG_SECRETS_VOLUME:-ibkr-cpg-secrets}
