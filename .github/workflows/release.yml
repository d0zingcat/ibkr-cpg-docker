name: release
on:
  push:
    tags: ['v*']
jobs:
  image:
    permissions: {contents: read, packages: write, id-token: write, attestations: write}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/ibkr-cpg-docker
          # Publish the release tag itself (e.g. v0.1.4) so deployment
          # configuration can use a clear, immutable-at-release reference.
          tags: type=ref,event=tag
      - uses: docker/build-push-action@v6
        id: build
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          sbom: true
          provenance: mode=max
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/ibkr-cpg-docker
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
