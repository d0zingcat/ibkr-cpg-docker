name: ci
on: [pull_request, push]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pytest && pytest
      - run: python -m compileall sidecar
      - uses: zricethezav/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: grep -q 'Apache License' LICENSE
  container-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          ! grep -R --line-number -E 'IBKR_(USERNAME|PASSWORD|TOTP)=' . --exclude-dir=.git
          grep -q 'USER 10001' Dockerfile
          grep -q 'read_only: true' docker-compose.example.yml
          ! grep -q '^    ports:' docker-compose.example.yml
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # This target is deliberately independent of the licensed CPG archive,
      # so every pull request verifies the Docker image foundation without
      # downloading mutable third-party binaries. Tag releases build `runtime`.
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: base
          push: false
          tags: ibkr-cpg-docker:ci
